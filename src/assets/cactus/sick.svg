<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" fill="none">
  <!-- Pot -->
  <rect x="65" y="225" width="70" height="45" rx="4" fill="#B5541A"/>
  <rect x="58" y="218" width="84" height="14" rx="4" fill="#D4622B"/>
  <!-- Soil - slightly dry -->
  <ellipse cx="100" cy="224" rx="33" ry="5" fill="#5D3317"/>
  <line x1="82" y1="222" x2="90" y2="224" stroke="#8D6E63" stroke-width="1"/>
  <line x1="110" y1="222" x2="118" y2="224" stroke="#8D6E63" stroke-width="1"/>
  <!-- Main trunk - slightly yellowed -->
  <rect x="83" y="92" width="34" height="138" rx="17" fill="#558B2F"/>
  <rect x="88" y="94" width="10" height="133" rx="5" fill="#689F38" opacity="0.4"/>
  <!-- Yellow-brown patches (sick spots) -->
  <ellipse cx="92" cy="140" rx="6" ry="8" fill="#9E9D24" opacity="0.6"/>
  <ellipse cx="110" cy="165" rx="4" ry="6" fill="#9E9D24" opacity="0.5"/>
  <!-- Left arm - drooping slightly -->
  <path d="M83,150 Q42,152 42,118 Q42,96 60,94 Q78,92 83,112" fill="#558B2F"/>
  <ellipse cx="51" cy="92" rx="11" ry="14" fill="#558B2F"/>
  <!-- Right arm - drooping slightly -->
  <path d="M117,150 Q158,152 158,118 Q158,96 140,94 Q122,92 117,112" fill="#558B2F"/>
  <ellipse cx="149" cy="92" rx="11" ry="14" fill="#558B2F"/>
  <!-- Top cap -->
  <ellipse cx="100" cy="92" rx="17" ry="19" fill="#558B2F"/>
  <!-- Spines - fewer, duller -->
  <line x1="83" y1="115" x2="73" y2="112" stroke="#C5E1A5" stroke-width="1.5"/>
  <line x1="83" y1="135" x2="73" y2="132" stroke="#C5E1A5" stroke-width="1.5"/>
  <line x1="83" y1="155" x2="73" y2="152" stroke="#C5E1A5" stroke-width="1.5"/>
  <line x1="83" y1="175" x2="73" y2="172" stroke="#C5E1A5" stroke-width="1.5"/>
  <line x1="117" y1="115" x2="127" y2="112" stroke="#C5E1A5" stroke-width="1.5"/>
  <line x1="117" y1="135" x2="127" y2="132" stroke="#C5E1A5" stroke-width="1.5"/>
  <line x1="117" y1="155" x2="127" y2="152" stroke="#C5E1A5" stroke-width="1.5"/>
  <line x1="117" y1="175" x2="127" y2="172" stroke="#C5E1A5" stroke-width="1.5"/>
  <!-- Wilted flower -->
  <circle cx="100" cy="74" r="4" fill="#E65100" opacity="0.7"/>
  <circle cx="100" cy="74" r="2" fill="#BF360C" opacity="0.7"/>
</svg>
