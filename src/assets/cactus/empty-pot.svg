<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" fill="none">
  <!-- Pot - cracked and empty -->
  <rect x="60" y="190" width="80" height="70" rx="5" fill="#8D4015"/>
  <rect x="52" y="182" width="96" height="16" rx="5" fill="#A84E22"/>
  <!-- Crack on pot -->
  <path d="M92,192 Q88,210 90,240 Q88,255 85,268" stroke="#5D2500" stroke-width="2.5" fill="none"/>
  <path d="M118,200 Q122,215 120,235" stroke="#5D2500" stroke-width="1.5" fill="none"/>
  <!-- Inner shadow -->
  <ellipse cx="100" cy="188" rx="38" ry="8" fill="#6D2E0A" opacity="0.5"/>
  <!-- Dry empty soil -->
  <ellipse cx="100" cy="192" rx="40" ry="10" fill="#2E1108"/>
  <!-- Soil cracks -->
  <path d="M80,192 Q90,188 100,192 Q110,196 120,192" stroke="#4E342E" stroke-width="1.5" fill="none"/>
  <path d="M90,196 Q95,192 100,196" stroke="#4E342E" stroke-width="1" fill="none"/>
  <path d="M100,192 Q100,198 105,200" stroke="#4E342E" stroke-width="1" fill="none"/>
  <!-- Dried roots remnants -->
  <path d="M95,195 Q90,205 85,210" stroke="#5D4037" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M105,195 Q110,205 115,210" stroke="#5D4037" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M100,196 Q100,208 100,215" stroke="#5D4037" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Small dust particles -->
  <circle cx="78" cy="185" r="1.5" fill="#8D6E63" opacity="0.6"/>
  <circle cx="122" cy="187" r="1" fill="#8D6E63" opacity="0.6"/>
  <circle cx="95" cy="180" r="1" fill="#8D6E63" opacity="0.4"/>
</svg>
