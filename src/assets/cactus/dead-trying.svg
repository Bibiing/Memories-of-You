<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" fill="none">
  <!-- Pot - cracked -->
  <rect x="65" y="225" width="70" height="45" rx="4" fill="#8D4015"/>
  <rect x="58" y="218" width="84" height="14" rx="4" fill="#A84E22"/>
  <line x1="88" y1="225" x2="83" y2="265" stroke="#5D2500" stroke-width="2"/>
  <line x1="115" y1="230" x2="112" y2="268" stroke="#5D2500" stroke-width="1.5"/>
  <!-- Very dry soil -->
  <ellipse cx="100" cy="224" rx="33" ry="5" fill="#3E1F08"/>
  <path d="M72,224 Q82,220 92,224 Q102,228 112,224 Q122,220 128,224" stroke="#6D4C41" stroke-width="1" fill="none"/>
  <!-- Main trunk - mostly dead, grey-brown -->
  <rect x="86" y="100" width="28" height="130" rx="14" fill="#5D4037"/>
  <rect x="91" y="102" width="7" height="125" rx="3.5" fill="#6D4C41" opacity="0.3"/>
  <!-- Shriveled texture -->
  <path d="M86,120 Q82,130 86,140 Q82,150 86,160 Q82,170 86,180 Q82,190 86,200" stroke="#4E342E" stroke-width="2" fill="none"/>
  <path d="M114,120 Q118,130 114,140 Q118,150 114,160 Q118,170 114,180 Q118,190 114,200" stroke="#4E342E" stroke-width="2" fill="none"/>
  <!-- Dead arms - hanging limp -->
  <path d="M86,160 Q55,165 53,185 Q52,200 65,202 Q75,203 78,188 Q82,174 86,162" fill="#5D4037"/>
  <path d="M114,160 Q145,165 147,185 Q148,200 135,202 Q125,203 122,188 Q118,174 114,162" fill="#5D4037"/>
  <!-- Top - dead but has ONE tiny green bud! -->
  <ellipse cx="100" cy="100" rx="14" ry="16" fill="#5D4037"/>
  <!-- The tiny living bud - hope! -->
  <line x1="100" y1="85" x2="100" y2="70" stroke="#33691E" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="100" cy="67" rx="5" ry="7" fill="#558B2F"/>
  <ellipse cx="96" cy="72" rx="4" ry="5" fill="#7CB342" transform="rotate(-20 96 72)"/>
  <ellipse cx="104" cy="72" rx="4" ry="5" fill="#7CB342" transform="rotate(20 104 72)"/>
</svg>
